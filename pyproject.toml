[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "langgraph", "fastmcp==3.3.1", "mcp==1.24.0", "rank-bm25", "openai", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/shopsense/prompts.py" = ["E501"]
